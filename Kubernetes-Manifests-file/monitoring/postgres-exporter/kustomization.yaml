apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: prometheus-postgres-exporter
    repo: https://prometheus-community.github.io/helm-charts
    version: 7.4.0
    releaseName: postgres-exporter
    namespace: monitoring
    valuesFile: values.yaml

resources:
  - configmap.yaml
  - sealed-secret.yaml