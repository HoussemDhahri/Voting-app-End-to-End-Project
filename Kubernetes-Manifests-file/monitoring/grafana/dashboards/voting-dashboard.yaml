            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "min(probe_success{job=\"result-frontend-blackbox\",instance=~\".*${namespace}.*\"}) or vector(0)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 1,
              "unit": "short",
              "mappings": [
                {
                  "type": "value",
