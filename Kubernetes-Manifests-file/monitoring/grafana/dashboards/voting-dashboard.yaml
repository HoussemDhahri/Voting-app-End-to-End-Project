          "targets": [
            {
              "refId": "A",
              "format": "table",
              "instant": true,
              "expr": "kube_pod_container_status_waiting_reason{namespace=\"$namespace\"} == 1"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
