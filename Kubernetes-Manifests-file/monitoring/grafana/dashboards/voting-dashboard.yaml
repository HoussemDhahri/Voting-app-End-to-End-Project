                  "__name__": true,
                  "job": true,
                  "instance": true,
                  "endpoint": true,
                  "service": true,
                  "uid": true,
                  "namespace": true,
                  "Value": true
                },
                "indexByName": {
                  "pod": 0,
                  "container": 1,
                  "reason": 2
                },
                "renameByName": {
                  "pod": "Pod",
                  "container": "Container",
                  "reason": "Reason"
