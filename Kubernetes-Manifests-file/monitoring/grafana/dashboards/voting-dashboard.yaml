          },
          "targets": [
            {
              "refId": "A",
              "format": "table",
              "instant": true,
              "expr": "max by (persistentvolumeclaim) (local_pvc_capacity_bytes{exported_namespace=\"$namespace\",persistentvolumeclaim=~\".*postgres.*\"})"
            },
            {
              "refId": "B",
              "format": "table",
              "instant": true,
              "expr": "max by (persistentvolumeclaim) (local_pvc_used_bytes{exported_namespace=\"$namespace\",persistentvolumeclaim=~\".*postgres.*\"})"
            },
            {
              "refId": "C",
              "format": "table",
              "instant": true,
              "expr": "max by (persistentvolumeclaim) (local_pvc_available_bytes{exported_namespace=\"$namespace\",persistentvolumeclaim=~\".*postgres.*\"})"
            },
            {
              "refId": "D",
              "format": "table",
              "instant": true,
              "expr": "100 * max by (persistentvolumeclaim) (local_pvc_used_ratio{exported_namespace=\"$namespace\",persistentvolumeclaim=~\".*postgres.*\"})"
            }
          ],
          "transformations": [
            {
              "id": "joinByField",
              "options": {
                "byField": "persistentvolumeclaim",
                "mode": "outer"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "exported_namespace": true,
                  "namespace": true,
                  "job": true,
                  "instance": true,
                  "container": true,
                  "endpoint": true,
                  "pod": true,
                  "service": true,
                  "node": true,
                  "persistentvolume": true,
                  "storageclass": true,
                  "volume_type": true
                },
                "indexByName": {
                  "persistentvolumeclaim": 0,
                  "Value #A": 1,
                  "Value #B": 2,
                  "Value #C": 3,
                  "Value #D": 4
                },
                "renameByName": {
                  "persistentvolumeclaim": "Name",
                  "Value #A": "Total",
                  "Value #B": "Used",
                  "Value #C": "Available",
                  "Value #D": "Usage %"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                }
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Total"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "bytes"
                  },
                  {
                    "id": "decimals",
                    "value": 1
                  }
                ]
              },
              {
                "matcher": {
