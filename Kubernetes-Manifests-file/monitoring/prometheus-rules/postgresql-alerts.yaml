apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: postgresql-alerts
  namespace: monitoring
  labels:
    release: monitoring

spec:
  groups:
    - name: postgresql-alerts
      rules:

        - alert: PostgreSQLDown
          expr: |
            pg_up{
              namespace="monitoring",
              target=~"postgres-(staging|prod)"
            } == 0
          for: 2m
          labels:
            severity: critical
            component: postgresql
          annotations:
            summary: "PostgreSQL is down"
            description: "PostgreSQL has been unreachable for more than 2 minutes."

        - alert: PostgreSQLHighConnections
          expr: |
            (
              sum by (namespace, target) (
                pg_stat_database_numbackends{
                  namespace="monitoring",
                  target=~"postgres-(staging|prod)",
                  datname!~"template0|template1"
                }
              )
              /
              on (namespace, target)
              max by (namespace, target) (
                pg_settings_max_connections{
                  namespace="monitoring",
                  target=~"postgres-(staging|prod)"
                }
              )
            ) > 0.80
          for: 10m
          labels:
            severity: warning
            component: postgresql
          annotations:
            summary: "PostgreSQL connections are high"
            description: "PostgreSQL is using more than 80% of its configured maximum connections for more than 10 minutes."

        - alert: PostgreSQLHighCPU
          expr: |
            (
              sum by (namespace, pod) (
                rate(
                  container_cpu_usage_seconds_total{
                    namespace=~"voting-(staging|prod)",
                    pod=~"postgres-.*",
                    container!="",
                    container!="POD"
                  }[5m]
                )
              )
              /
              sum by (namespace, pod) (
                kube_pod_container_resource_requests{
                  namespace=~"voting-(staging|prod)",
                  pod=~"postgres-.*",
                  resource="cpu",
                  unit="core"
                }
              )
            ) > 0.80
          for: 10m
          labels:
            severity: warning
            component: postgresql
          annotations:
            summary: "PostgreSQL CPU usage is high"
            description: "PostgreSQL CPU usage is above 80% of its requested CPU for more than 10 minutes."

        - alert: PostgreSQLHighMemory
          expr: |
            (
              sum by (namespace, pod) (
                container_memory_working_set_bytes{
                  namespace=~"voting-(staging|prod)",
                  pod=~"postgres-.*",
                  container!="",
                  container!="POD"
                }
              )
              /
              sum by (namespace, pod) (
                kube_pod_container_resource_requests{
                  namespace=~"voting-(staging|prod)",
                  pod=~"postgres-.*",
                  resource="memory",
                  unit="byte"
                }
              )
            ) > 0.80
          for: 10m
          labels:
            severity: warning
            component: postgresql
          annotations:
            summary: "PostgreSQL memory usage is high"
            description: "PostgreSQL memory usage is above 80% of its requested memory for more than 10 minutes."

        - alert: PostgreSQLPodRestarting
          expr: |
            increase(
              kube_pod_container_status_restarts_total{
                namespace=~"voting-(staging|prod)",
                pod=~"postgres-.*"
              }[10m]
            ) > 3
          for: 1m
          labels:
            severity: warning
            component: postgresql
          annotations:
            summary: "PostgreSQL pod is restarting"
            description: "The PostgreSQL pod has restarted more than 3 times in the last 10 minutes."