apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: result-frontend-alerts
  namespace: monitoring
  labels:
    release: monitoring

spec:
  groups:
    - name: result-alerts
      rules:

        - alert: ResultFrontendDown
          expr: |
            probe_success{
              job="result-frontend-blackbox",
              instance=~"http://result-service\\.voting-(staging|prod)\\.svc:4000/.*"
            } == 0
          for: 2m
          labels:
            severity: critical
            component: result
          annotations:
            summary: "Result frontend is down"
            description: "The Result frontend is not reachable for more than 2 minutes."

        - alert: ResultFrontendHighErrorRate
          expr: |
            probe_http_status_code{
              job="result-frontend-blackbox",
              instance=~"http://result-service\\.voting-(staging|prod)\\.svc:4000/.*"
            } >= 500
          for: 5m
          labels:
            severity: critical
            component: result
          annotations:
            summary: "Result frontend returning server errors"
            description: "The Result frontend is returning HTTP 5xx responses for more than 5 minutes."

        - alert: ResultFrontendClientErrors
          expr: |
            probe_http_status_code{
              job="result-frontend-blackbox",
              instance=~"http://result-service\\.voting-(staging|prod)\\.svc:4000/.*"
            } >= 400
            and
            probe_http_status_code{
              job="result-frontend-blackbox",
              instance=~"http://result-service\\.voting-(staging|prod)\\.svc:4000/.*"
            } < 500
          for: 5m
          labels:
            severity: warning
            component: result
          annotations:
            summary: "Result frontend returning client errors"
            description: "The Result frontend is returning HTTP 4xx responses for more than 5 minutes."

        - alert: ResultFrontendSlow
          expr: |
            probe_duration_seconds{
              job="result-frontend-blackbox",
              instance=~"http://result-service\\.voting-(staging|prod)\\.svc:4000/.*"
            } > 2
          for: 5m
          labels:
            severity: warning
            component: result
          annotations:
            summary: "Result frontend is slow"
            description: "The Result frontend response time is above 2 seconds for more than 5 minutes."

        - alert: ResultFrontendHighCPU
          expr: |
            (
              sum by (namespace, pod) (
                rate(
                  container_cpu_usage_seconds_total{
                    namespace=~"voting-(staging|prod)",
                    pod=~"result-deployment-.*",
                    container!="",
                    container!="POD"
                  }[5m]
                )
              )
              /
              sum by (namespace, pod) (
                kube_pod_container_resource_requests{
                  namespace=~"voting-(staging|prod)",
                  pod=~"result-deployment-.*",
                  resource="cpu",
                  unit="core"
                }
              )
            ) > 0.80
          for: 10m
          labels:
            severity: warning
            component: result
          annotations:
            summary: "Result frontend CPU usage is high"
            description: "Result frontend CPU usage is above 80% of its requested CPU for more than 10 minutes."

        - alert: ResultFrontendHighMemory
          expr: |
            (
              sum by (namespace, pod) (
                container_memory_working_set_bytes{
                  namespace=~"voting-(staging|prod)",
                  pod=~"result-deployment-.*",
                  container!="",
                  container!="POD"
                }
              )
              /
              sum by (namespace, pod) (
                kube_pod_container_resource_requests{
                  namespace=~"voting-(staging|prod)",
                  pod=~"result-deployment-.*",
                  resource="memory",
                  unit="byte"
                }
              )
            ) > 0.80
          for: 10m
          labels:
            severity: warning
            component: result
          annotations:
            summary: "Result frontend memory usage is high"
            description: "Result frontend memory usage is above 80% of its requested memory for more than 10 minutes."

        - alert: ResultFrontendPodRestarting
          expr: |
            increase(
              kube_pod_container_status_restarts_total{
                namespace=~"voting-(staging|prod)",
                pod=~"result-deployment-.*"
              }[10m]
            ) > 3
          for: 1m
          labels:
            severity: warning
            component: result
          annotations:
            summary: "Result frontend pod is restarting"
            description: "The Result frontend pod has restarted more than 3 times in the last 10 minutes."