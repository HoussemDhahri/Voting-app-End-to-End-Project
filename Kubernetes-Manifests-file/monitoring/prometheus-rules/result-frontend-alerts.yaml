apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: result-frontend-alerts
  namespace: monitoring
  labels:
    release: monitoring

spec:
  groups:
    - name: result-alerts
      rules:

        - alert: ResultFrontendDown
          expr: |
            (
              label_replace(
                probe_success{
                  job="result-frontend-blackbox",
                  instance=~"http://result-service\\.voting-(staging|prod)\\.svc:4000/"
                },
                "target_namespace",
                "$1",
                "instance",
                "http://result-service\\.(voting-(staging|prod))\\.svc:4000/"
              ) == 0
            )
            and on (target_namespace)
            (
              label_replace(
                kube_namespace_status_phase{
                  namespace=~"voting-(staging|prod)",
                  phase="Active"
                },
                "target_namespace",
                "$1",
                "namespace",
                "(voting-(staging|prod))"
              ) == 1
            )
          for: 2m
          labels:
            severity: critical
            component: result
            namespace: monitoring
          annotations:
            summary: "Result frontend is down in {{ $labels.target_namespace }}"
            description: "Result frontend target {{ $labels.instance }} is unreachable in {{ $labels.target_namespace }} for more than 2 minutes."

        - alert: ResultFrontendServerErrors
          expr: |
            (
              label_replace(
                probe_http_status_code{
                  job="result-frontend-blackbox",
                  instance=~"http://result-service\\.voting-(staging|prod)\\.svc:4000/"
                },
                "target_namespace",
                "$1",
                "instance",
                "http://result-service\\.(voting-(staging|prod))\\.svc:4000/"
              ) >= 500
            )
            and on (target_namespace)
            (
              label_replace(
                kube_namespace_status_phase{
                  namespace=~"voting-(staging|prod)",
                  phase="Active"
                },
                "target_namespace",
                "$1",
                "namespace",
                "(voting-(staging|prod))"
              ) == 1
            )
          for: 5m
          labels:
            severity: critical
            component: result
            namespace: monitoring
          annotations:
            summary: "Result frontend server errors in {{ $labels.target_namespace }}"
            description: "Result frontend target {{ $labels.instance }} is returning HTTP 5xx responses in {{ $labels.target_namespace }} for more than 5 minutes."

        - alert: ResultFrontendClientErrors
          expr: |
            (
              label_replace(
                probe_http_status_code{
                  job="result-frontend-blackbox",
                  instance=~"http://result-service\\.voting-(staging|prod)\\.svc:4000/"
                },
                "target_namespace",
                "$1",
                "instance",
                "http://result-service\\.(voting-(staging|prod))\\.svc:4000/"
              ) >= 400
              and
              label_replace(
                probe_http_status_code{
                  job="result-frontend-blackbox",
                  instance=~"http://result-service\\.voting-(staging|prod)\\.svc:4000/"
                },
                "target_namespace",
                "$1",
                "instance",
                "http://result-service\\.(voting-(staging|prod))\\.svc:4000/"
              ) < 500
            )
            and on (target_namespace)
            (
              label_replace(
                kube_namespace_status_phase{
                  namespace=~"voting-(staging|prod)",
                  phase="Active"
                },
                "target_namespace",
                "$1",
                "namespace",
                "(voting-(staging|prod))"
              ) == 1
            )
          for: 5m
          labels:
            severity: warning
            component: result
            namespace: monitoring
          annotations:
            summary: "Result frontend client errors in {{ $labels.target_namespace }}"
            description: "Result frontend target {{ $labels.instance }} is returning HTTP 4xx responses in {{ $labels.target_namespace }} for more than 5 minutes."

        - alert: ResultFrontendSlow
          expr: |
            (
              label_replace(
                probe_duration_seconds{
                  job="result-frontend-blackbox",
                  instance=~"http://result-service\\.voting-(staging|prod)\\.svc:4000/"
                },
                "target_namespace",
                "$1",
                "instance",
                "http://result-service\\.(voting-(staging|prod))\\.svc:4000/"
              ) > 2
            )
            and on (target_namespace)
            (
              label_replace(
                kube_namespace_status_phase{
                  namespace=~"voting-(staging|prod)",
                  phase="Active"
                },
                "target_namespace",
                "$1",
                "namespace",
                "(voting-(staging|prod))"
              ) == 1
            )
          for: 5m
          labels:
            severity: warning
            component: result
            namespace: monitoring
          annotations:
            summary: "Result frontend is slow in {{ $labels.target_namespace }}"
            description: "Result frontend target {{ $labels.instance }} in {{ $labels.target_namespace }} has a response time above 2 seconds for more than 5 minutes."

        - alert: ResultFrontendHighCPU
          expr: |
            label_replace(
              (
                sum by (namespace, pod) (
                  rate(
                    container_cpu_usage_seconds_total{
                      namespace=~"voting-(staging|prod)",
                      pod=~"result-deployment-.*",
                      container="result-container"
                    }[5m]
                  )
                )
                /
                sum by (namespace, pod) (
                  kube_pod_container_resource_requests{
                    namespace=~"voting-(staging|prod)",
                    pod=~"result-deployment-.*",
                    container="result-container",
                    resource="cpu",
                    unit="core"
                  }
                )
              ),
              "target_namespace",
              "$1",
              "namespace",
              "(voting-(staging|prod))"
            ) > 0.80
          for: 10m
          labels:
            severity: warning
            component: result
            namespace: monitoring
          annotations:
            summary: "Result frontend CPU is high in {{ $labels.target_namespace }}"
            description: "Result frontend pod {{ $labels.pod }} in {{ $labels.target_namespace }} is using more than 80% of its requested CPU for more than 10 minutes."

        - alert: ResultFrontendHighMemory
          expr: |
            label_replace(
              (
                sum by (namespace, pod) (
                  container_memory_working_set_bytes{
                    namespace=~"voting-(staging|prod)",
                    pod=~"result-deployment-.*",
                    container="result-container"
                  }
                )
                /
                sum by (namespace, pod) (
                  kube_pod_container_resource_requests{
                    namespace=~"voting-(staging|prod)",
                    pod=~"result-deployment-.*",
                    container="result-container",
                    resource="memory",
                    unit="byte"
                  }
                )
              ),
              "target_namespace",
              "$1",
              "namespace",
              "(voting-(staging|prod))"
            ) > 0.80
          for: 10m
          labels:
            severity: warning
            component: result
            namespace: monitoring
          annotations:
            summary: "Result frontend memory is high in {{ $labels.target_namespace }}"
            description: "Result frontend pod {{ $labels.pod }} in {{ $labels.target_namespace }} is using more than 80% of its requested memory for more than 10 minutes."

        - alert: ResultFrontendPodRestarting
          expr: |
            label_replace(
              sum by (namespace, pod) (
                increase(
                  kube_pod_container_status_restarts_total{
                    namespace=~"voting-(staging|prod)",
                    pod=~"result-deployment-.*",
                    container="result-container"
                  }[10m]
                )
              ),
              "target_namespace",
              "$1",
              "namespace",
              "(voting-(staging|prod))"
            ) > 3
          for: 3m
          labels:
            severity: warning
            component: result
            namespace: monitoring
          annotations:
            summary: "Result frontend pod is restarting in {{ $labels.target_namespace }}"
            description: "Result frontend pod {{ $labels.pod }} in {{ $labels.target_namespace }} has restarted more than 3 times in the last 10 minutes."