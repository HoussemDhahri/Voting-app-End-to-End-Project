apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: redis-alerts
  namespace: monitoring
  labels:
    release: monitoring

spec:
  groups:
    - name: redis-alerts
      rules:

        - alert: RedisDown
          expr: |
            label_replace(
              redis_up{
                namespace="monitoring",
                target=~"redis-(staging|prod)"
              } == 0,
              "target_namespace",
              "voting-$1",
              "target",
              "redis-(staging|prod)"
            )
          for: 2m
          labels:
            namespace: monitoring
            severity: critical
            component: redis
          annotations:
            summary: "Redis is down"
            description: "Redis has been unreachable for more than 2 minutes."

        - alert: RedisRejectedConnections
          expr: |
            label_replace(
              increase(
                redis_rejected_connections_total{
                  namespace="monitoring",
                  target=~"redis-(staging|prod)"
                }[5m]
              ) > 0,
              "target_namespace",
              "voting-$1",
              "target",
              "redis-(staging|prod)"
            )
          for: 2m
          labels:
            namespace: monitoring
            severity: warning
            component: redis
          annotations:
            summary: "Redis is rejecting connections"
            description: "Redis has rejected client connections during the last 5 minutes."
        
        - alert: RedisHighCPU
          expr: |
            label_replace(
              (
                sum by (namespace, pod) (
                  rate(
                    container_cpu_usage_seconds_total{
                      namespace=~"voting-(staging|prod)",
                      pod=~"redis-statefulset-.*",
                      container="redis-container"
                    }[5m]
                  )
                )
                /
                sum by (namespace, pod) (
                  kube_pod_container_resource_requests{
                    namespace=~"voting-(staging|prod)",
                    pod=~"redis-statefulset-.*",
                    container="redis-container",
                    resource="cpu",
                    unit="core"
                  }
                )
              ) > 0.80,
              "target_namespace",
              "$1",
              "namespace",
              "(.*)"
            )
          for: 10m
          labels:
            namespace: monitoring
            severity: warning
            component: redis
          annotations:
            summary: "Redis CPU usage is high"
            description: "Redis CPU usage is above 80% of its requested CPU for more than 10 minutes."
        
        - alert: RedisHighMemoryUsage
          expr: |
            label_replace(
              (
                sum by (namespace, pod) (
                  container_memory_working_set_bytes{
                    namespace=~"voting-(staging|prod)",
                    pod=~"redis-statefulset-.*",
                    container="redis-container"
                  }
                )
                /
                sum by (namespace, pod) (
                  kube_pod_container_resource_requests{
                    namespace=~"voting-(staging|prod)",
                    pod=~"redis-statefulset-.*",
                    container="redis-container",
                    resource="memory",
                    unit="byte"
                  }
                )
              ) > 0.80,
              "target_namespace",
              "$1",
              "namespace",
              "(.*)"
            )
          for: 10m
          labels:
            namespace: monitoring
            severity: warning
            component: redis
          annotations:
            summary: "Redis memory usage is high"
            description: "Redis memory usage is above 80% of its requested memory for more than 10 minutes."

        - alert: RedisPodRestarting
          expr: |
            label_replace(
              increase(
                kube_pod_container_status_restarts_total{
                  namespace=~"voting-(staging|prod)",
                  pod=~"redis-statefulset-.*",
                  container="redis-container"
                }[10m]
              ) > 3,
              "target_namespace",
              "$1",
              "namespace",
              "(.*)"
            )
          for: 1m
          labels:
            namespace: monitoring
            severity: warning
            component: redis
          annotations:
            summary: "Redis pod is restarting"
            description: "The Redis pod has restarted more than 3 times in the last 10 minutes."