apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: redis-alerts
  namespace: monitoring
  labels:
    release: monitoring

spec:
  groups:
    - name: redis-alerts
      rules:

        - alert: RedisDown
          expr: |
            (
              label_replace(
                redis_up{
                  namespace="monitoring",
                  target=~"redis-(staging|prod)"
                },
                "target_namespace",
                "voting-$1",
                "target",
                "redis-(staging|prod)"
              ) == 0
            )
            and on (target_namespace)
            (
              label_replace(
                kube_namespace_status_phase{
                  namespace=~"voting-(staging|prod)",
                  phase="Active"
                },
                "target_namespace",
                "$1",
                "namespace",
                "(voting-(staging|prod))"
              ) == 1
            )
          for: 2m
          labels:
            severity: critical
            component: redis
            namespace: monitoring
          annotations:
            summary: "Redis is down in {{ $labels.target_namespace }}"
            description: "Redis target {{ $labels.target }} in {{ $labels.target_namespace }} has been unreachable for more than 2 minutes."

        - alert: RedisRejectedConnections
          expr: |
            label_replace(
              increase(
                redis_rejected_connections_total{
                  namespace="monitoring",
                  target=~"redis-(staging|prod)"
                }[5m]
              ) > 0,
              "target_namespace",
              "voting-$1",
              "target",
              "redis-(staging|prod)"
            )
          for: 2m
          labels:
            severity: warning
            component: redis
            namespace: monitoring
          annotations:
            summary: "Redis is rejecting connections in {{ $labels.target_namespace }}"
            description: "Redis target {{ $labels.target }} in {{ $labels.target_namespace }} has rejected client connections during the last 5 minutes."

        - alert: RedisHighCPU
          expr: |
            label_replace(
              (
                sum by (namespace, pod) (
                  rate(
                    container_cpu_usage_seconds_total{
                      namespace=~"voting-(staging|prod)",
                      pod=~"redis-statefulset-.*",
                      container="redis-container"
                    }[5m]
                  )
                )
                /
                sum by (namespace, pod) (
                  kube_pod_container_resource_requests{
                    namespace=~"voting-(staging|prod)",
                    pod=~"redis-statefulset-.*",
                    container="redis-container",
                    resource="cpu",
                    unit="core"
                  }
                )
              ),
              "target_namespace",
              "$1",
              "namespace",
              "(voting-(staging|prod))"
            ) > 0.80
          for: 10m
          labels:
            severity: warning
            component: redis
            namespace: monitoring
          annotations:
            summary: "Redis CPU is high in {{ $labels.target_namespace }}"
            description: "Redis pod {{ $labels.pod }} in {{ $labels.target_namespace }} is using more than 80% of its requested CPU for more than 10 minutes."

        - alert: RedisHighMemory
          expr: |
            label_replace(
              (
                sum by (namespace, pod) (
                  container_memory_working_set_bytes{
                    namespace=~"voting-(staging|prod)",
                    pod=~"redis-statefulset-.*",
                    container="redis-container"
                  }
                )
                /
                sum by (namespace, pod) (
                  kube_pod_container_resource_requests{
                    namespace=~"voting-(staging|prod)",
                    pod=~"redis-statefulset-.*",
                    container="redis-container",
                    resource="memory",
                    unit="byte"
                  }
                )
              ),
              "target_namespace",
              "$1",
              "namespace",
              "(voting-(staging|prod))"
            ) > 0.80
          for: 10m
          labels:
            severity: warning
            component: redis
            namespace: monitoring
          annotations:
            summary: "Redis memory is high in {{ $labels.target_namespace }}"
            description: "Redis pod {{ $labels.pod }} in {{ $labels.target_namespace }} is using more than 80% of its requested memory for more than 10 minutes."

        - alert: RedisPodRestarting
          expr: |
            label_replace(
              increase(
                kube_pod_container_status_restarts_total{
                  namespace=~"voting-(staging|prod)",
                  pod=~"redis-statefulset-.*",
                  container="redis-container"
                }[10m]
              ) > 3,
              "target_namespace",
              "$1",
              "namespace",
              "(voting-(staging|prod))"
            )
          for: 3m
          labels:
            severity: warning
            component: redis
            namespace: monitoring
          annotations:
            summary: "Redis pod is restarting in {{ $labels.target_namespace }}"
            description: "Redis pod {{ $labels.pod }} in {{ $labels.target_namespace }} has restarted more than 3 times in the last 10 minutes."