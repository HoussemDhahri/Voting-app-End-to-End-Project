apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: voting-loadtest
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/HoussemDhahri/Voting-app-End-to-End-Project.git
    targetRevision: main
    path: Kubernetes-Manifests-file/overlays/prod/loadgenerator

  destination:
    server: https://kubernetes.default.svc
    namespace: voting-prod

  syncPolicy: {}