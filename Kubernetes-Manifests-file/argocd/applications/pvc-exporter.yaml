apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pvc-exporter
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/HoussemDhahri/Voting-app-End-to-End-Project.git
    targetRevision: main
    path: Kubernetes-Manifests-file/monitoring/pvc-exporter

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true