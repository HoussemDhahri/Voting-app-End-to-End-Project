apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: monitoring-postgres-exporter
  namespace: argocd

spec:
  project: default

  sources:

    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus-postgres-exporter
      targetRevision: 7.4.0
      helm:
        releaseName: postgres-exporter
        valueFiles:
          - $values/Kubernetes-Manifests-file/monitoring/postgres-exporter/values.yaml

    - repoURL: https://github.com/HoussemDhahri/Voting-app-End-to-End-Project.git
      targetRevision: main
      ref: values
      path: Kubernetes-Manifests-file/monitoring/postgres-exporter

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true