apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: monitoring-redis-exporter
  namespace: argocd

spec:
  project: default

  sources:

    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus-redis-exporter
      targetRevision: 6.30.0
      helm:
        releaseName: redis-exporter
        valueFiles:
          - $values/Kubernetes-Manifests-file/monitoring/redis-exporter/values.yaml

    - repoURL: https://github.com/HoussemDhahri/Voting-app-End-to-End-Project.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true